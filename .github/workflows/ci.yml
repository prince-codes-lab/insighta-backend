name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-that-is-long-enough
          MONGODB_URI: mongodb://localhost:27017/insighta_test
          GITHUB_CLIENT_ID: test
          GITHUB_CLIENT_SECRET: test
          GITHUB_CALLBACK_URL: http://localhost:3000/auth/github/callback
          WEB_PORTAL_URL: http://localhost:5173
          PORT: 3000

      - name: Build check (verify all modules load)
        run: |
          node -e "
            process.env.JWT_SECRET = 'ci-test-secret-that-is-long-enough';
            process.env.MONGODB_URI = 'mongodb://localhost/test';
            process.env.GITHUB_CLIENT_ID = 'x';
            process.env.GITHUB_CLIENT_SECRET = 'x';
            process.env.GITHUB_CALLBACK_URL = 'http://localhost:3000/auth/github/callback';
            process.env.WEB_PORTAL_URL = 'http://localhost:5173';
            require('./src/app');
            console.log('Build check passed');
          "
